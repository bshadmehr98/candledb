# Dependabot opens a pull request when a dependency has a newer version.
# CI then runs on that pull request, so an update is tested before a human
# looks at it.
#
# "groups" collects all the updates of one kind into a single weekly pull
# request, instead of one pull request per dependency.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /sdk/js
      - /test/browser
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
