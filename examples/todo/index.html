<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todos on candledb</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #2f6fed; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  form { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
  input[type=text], input[type=email], input[type=password] {
    flex: 1; min-width: 8rem; padding: 0.5rem; border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  button { padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; background: var(--accent); color: white; font: inherit; cursor: pointer; }
  button.plain { background: none; color: inherit; border: 1px solid var(--line); }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { text-decoration: line-through; opacity: 0.55; }
  li.pending { opacity: 0.6; }
  .muted { opacity: 0.65; font-size: 0.9rem; }
  .error { color: #d33; min-height: 1.5rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Todos</h1>
<p class="muted">A complete app with no backend code: a static page, the candledb client and a rules file.</p>

<section id="signed-out">
  <form id="auth-form">
    <input type="email" id="email" placeholder="email" autocomplete="email" required>
    <input type="password" id="password" placeholder="password (8+ characters)" autocomplete="current-password" minlength="8" required>
    <button type="submit" name="action" value="signin">Sign in</button>
    <button type="submit" name="action" value="signup" class="plain">Create account</button>
  </form>
</section>

<section id="signed-in" hidden>
  <p class="muted">Signed in as <strong id="who"></strong> · <a href="#" id="signout">sign out</a></p>
  <form id="add-form">
    <input type="text" id="title" placeholder="What needs doing?" maxlength="200" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p class="muted" id="empty" hidden>Nothing to do. Open this page in a second window and add something there.</p>
</section>

<p class="error" id="error" role="alert"></p>

<script type="module">
  // The client is loaded straight from the SDK's build output. In a real
  // project you would install it with npm and let your bundler resolve it.
  import { createClient, serverTimestamp } from "../../sdk/js/dist/index.js";

  const db = createClient({
    url: new URLSearchParams(location.search).get("server") ?? "http://localhost:8090",
    storage: localStorage, // remember the session across page loads
  });

  const $ = (id) => document.getElementById(id);
  const showError = (err) => { $("error").textContent = err ? (err.message ?? String(err)) : ""; };

  let stopListening = null;

  // Everything hangs off the auth state: signed in means "listen to my
  // todos", signed out means "show the form".
  db.auth.onAuthStateChanged((user) => {
    stopListening?.();
    stopListening = null;
    $("signed-in").hidden = !user;
    $("signed-out").hidden = !!user;
    if (!user) return;

    $("who").textContent = user.email;
    const todos = db.collection(`users/${user.id}/todos`);

    // One listener keeps the list current: for changes made here, in
    // another tab, or on another device.
    stopListening = todos.orderBy("created").onSnapshot((snapshot) => {
      $("empty").hidden = !snapshot.empty;
      $("list").replaceChildren(...snapshot.docs.map(renderTodo));
    }, showError);

    $("add-form").onsubmit = async (event) => {
      event.preventDefault();
      const title = $("title").value.trim();
      if (!title) return;
      $("title").value = "";
      showError(null);
      // The new todo appears in the list at once (greyed out) and is
      // confirmed, or rolled back, when the server answers.
      try { await todos.add({ title, done: false, created: serverTimestamp() }); }
      catch (err) { showError(err); }
    };
  });

  function renderTodo(doc) {
    const { title, done } = doc.data();
    const li = document.createElement("li");
    li.classList.toggle("done", done);
    li.classList.toggle("pending", doc.metadata.hasPendingWrites);

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = done;
    box.setAttribute("aria-label", `Done: ${title}`);
    box.onchange = () => doc.ref.update({ done: box.checked }).catch(showError);

    const text = document.createElement("span");
    text.textContent = title; // textContent, never innerHTML: titles are user input

    const remove = document.createElement("button");
    remove.className = "plain";
    remove.textContent = "Delete";
    remove.onclick = () => doc.ref.delete().catch(showError);

    li.append(box, text, remove);
    return li;
  }

  $("auth-form").onsubmit = async (event) => {
    event.preventDefault();
    showError(null);
    const [email, password] = [$("email").value, $("password").value];
    try {
      if (event.submitter?.value === "signup") await db.auth.signUp(email, password);
      else await db.auth.signIn(email, password);
      $("password").value = "";
    } catch (err) { showError(err); }
  };

  $("signout").onclick = (event) => { event.preventDefault(); db.auth.signOut().catch(showError); };
</script>
</body>
</html>
